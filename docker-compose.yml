services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: mockai_livekit
    restart: unless-stopped
    command: --dev
    ports:
      - "7880:7880"      
      - "7881:7881"       
      - "7882:7882/udp"   

  neo4j:
    image: neo4j:5-community
    container_name: interview_platform_neo4j
    restart: unless-stopped
    ports:
      - "7475:7474"   
      - "7688:7687"   
    environment:
      - NEO4J_AUTH=neo4j/apoor9879
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1g
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mockai_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-mockai_qdrant_key}

  voice-agent:
    build:
      context: .
      dockerfile: Dockerfile  
    restart: always
    depends_on:
      - livekit
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    ports:
      - "8000:8000"
    network_mode: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  qdrant_data: